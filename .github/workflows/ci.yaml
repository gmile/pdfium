name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  build:
    runs-on: ${{ startsWith(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - aarch64-apple-darwin
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - x86_64-apple-darwin

    steps:
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.1-${{ matrix.target }}

      - run: mkdir --parents ${{ runner.temp }}/zig

      - name: Precompile and test
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: 1.0.0-beta.25
          dagger-flags: --progress plain --workspace github.com/gmile/pdfium@${{ github.sha }}
          args: >-
            ci \
              --target ${{ matrix.target }} \
              --cache ${{ runner.temp }}/zig \
            archive export \
              --path . \
              --allowParentDirPath

      - name: Keep zig's cache
        run: >-
          dagger --workspace github.com/gmile/pdfium@${{ github.sha }} call ci
          --target ${{ matrix.target }}
          --cache ${{ runner.temp }}/zig
          cache export --path ${{ runner.temp }}/zig

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: pdfium-nif-*
