name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""

      - run: nix flake check --print-build-logs

  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    outputs:
      unreleased: ${{ steps.release.outputs.unreleased }}

    steps:
      - uses: actions/checkout@v7.0.1

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "v$(cat VERSION)" > /dev/null || echo unreleased=true >> "$GITHUB_OUTPUT"

  archives:
    needs: [test, version]
    if: needs.version.outputs.unreleased == 'true'
    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        runs-on:
          - ubuntu-26.04
          - macos-26

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""

      - run: nix build .#archives --print-build-logs

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archives-${{ runner.os }}
          path: result/*

  release:
    needs: archives
    runs-on: ubuntu-26.04
    environment: hex
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: archives-*
          merge-multiple: true
          path: archives

      - env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#release -- archives
