name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15

    steps:
      - uses: actions/checkout@v7

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""

      - run: nix flake check --print-build-logs
