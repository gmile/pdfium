name: CI

on:
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: ubuntu-24.04-arm
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-linux-musl
            runner: ubuntu-24.04
          - target: x86_64-apple-darwin
            runner: ubuntu-24.04

    steps:
      - name: Precompile and test
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: 1.0.0-beta.25
          dagger-flags: --progress plain --workspace github.com/gmile/pdfium@${{ github.sha }}
          args: >-
            ci \
              --target ${{ matrix.target }} \
            export \
              --path . \
              --allowParentDirPath

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: pdfium-nif-*
