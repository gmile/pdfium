name: Release

on:
  push:
    branches:
      - main
    paths:
      - mix.exs

jobs:
  archives:
    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        runs-on:
          - ubuntu-24.04
          - macos-15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""

      - run: nix build .#archives --print-build-logs

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archives-${{ runner.os }}
          path: result/*

  release:
    needs: archives
    runs-on: ubuntu-24.04
    environment: hex
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: archives-*
          merge-multiple: true
          path: archives

      - env:
          GH_TOKEN: ${{ github.token }}
        run: nix run .#release -- archives
