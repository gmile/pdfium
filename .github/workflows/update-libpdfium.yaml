name: Update to latest libpdfium

on:
  workflow_dispatch:
  schedule:
    - cron: 0 13 * * 1

jobs:
  update-to-latest:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - run: gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: 1.0.0-beta.25

      - name: Push the bump
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          dagger call prepare-release
          --github-token env://GITHUB_TOKEN
          --actor 41898282+github-actions[bot]
          push --branch update-libpdfium

      - name: Open a pull request
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: dagger call open-pull-request --head update-libpdfium --github-token env://GITHUB_TOKEN stdout
