name: Update to latest libpdfium

on:
  workflow_dispatch:
  schedule:
    - cron: 0 13 * * 1

jobs:
  update-to-latest:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: check-latest-tag
        name: Check latest tag
        uses: dagger/dagger-for-github@v8.4.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          version: 0.21.6
          args: latest-tag-check --github-token env://GITHUB_TOKEN new-tag-available

      - id: latest-tag
        name: Get latest tag
        if: ${{ steps.check-latest-tag.outputs.output == 'true' }}
        uses: dagger/dagger-for-github@v8.4.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          version: 0.21.6
          args: latest-tag-check --github-token env://GITHUB_TOKEN latest-tag

      - name: Publish PR with version update
        if: ${{ steps.check-latest-tag.outputs.output == 'true' }}
        uses: dagger/dagger-for-github@v8.4.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          version: 0.21.6
          args: >-
            prepare-release-pull-request \
              --base stable \
              --libpdfium-tag ${{ steps.latest-tag.outputs.output }} \
              --actor 41898282+github-actions[bot] \
              --github-token env://GITHUB_TOKEN
